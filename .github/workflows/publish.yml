name: Release

# One pipeline, one trigger: push a `vX.Y.Z` tag and this:
#   1. validates the package (tests + audit + structure + pack),
#   2. enforces that the tag matches package.json (publish:check),
#   3. publishes to npm,
#   4. creates the matching GitHub Release (versions stay in sync).
#
# Release flow:
#   npm version patch        # bumps package.json + package-lock.json, makes the tag
#   git push --follow-tags   # pushes main + the tag → this workflow runs
#
# workflow_dispatch is available for a manual dry-run (or a forced publish).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run instead of publishing.
        required: true
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate package (tests, audit, structure, pack)
        run: npm run ci

      - name: Check publish readiness (tag matches version, not already on npm)
        run: npm run publish:check

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release tarball
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload release tarball artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

      - name: Build release notes from CHANGELOG
        if: github.event_name == 'push'
        run: node scripts/release-notes.mjs > RELEASE_NOTES.md

      - name: Create matching GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*.tgz
          fail_on_unmatched_files: false
