name: Bug report
description: Something in Goal Mode isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /goal ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Goal Mode version
      description: Output of `npm ls -g opencode-goal-mode` (or the installed version).
      placeholder: "0.6.x"
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode version
      placeholder: "e.g. 1.15.x"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shell guard (destructive command blocking)
        - Completion enforcement / review gates
        - TUI sidebar banner
        - Installer
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
