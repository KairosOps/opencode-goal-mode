<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" aria-label="OpenCode Goal Mode sidebar: in a goal session the plugin renders a stacked Goal todo section — a bold GOAL label, the goal title, a gates/status line, and per-gate todo rows — each on its own line in its own colour, opening with a first-display rainbow then settling (GOAL yellow, title white, status cyan) and turning red when done. Build and other modes render no Goal section and keep OpenCode's native todo list." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" viewBox="0 0 1000 452"><defs><style>.win{fill:#0d1117;stroke:#30363d;stroke-width:1}.bar{fill:#161b22}.dot{stroke-width:0}.hdr,.title{fill:#8b949e}.title{font-size:12px}.hdr{font-size:11px;letter-spacing:.5px}.lbl{font-weight:700}.lbl,.ln{font-size:13px}.sm{font-size:12px}.chat{fill:#c9d1d9}.chat,.dim,.ok{font-size:12px}.dim{fill:#6e7681}.ok{fill:#2da44e}.div{stroke:#30363d;stroke-width:1}.r0{fill:#f55}.r1{fill:#fa0}.r2{fill:#ff5}.r3{fill:#5f5}.label{fill:gold}.gtitle{fill:#fff}.meta{fill:#8be9fd}.todo{fill:gray}.done{fill:#f55}.check{fill:#50fa7b}</style></defs><rect width="998" height="450" x="1" y="1" class="win" rx="8"/><rect width="998" height="30" x="1" y="1" class="bar" rx="8"/><rect width="998" height="11" x="1" y="20" class="bar"/><circle cx="20" cy="16" r="5" fill="#ff5f56" class="dot"/><circle cx="38" cy="16" r="5" fill="#ffbd2e" class="dot"/><circle cx="56" cy="16" r="5" fill="#27c93f" class="dot"/><text x="86" y="20" class="title">opencode — goal mode</text><line x1="470" x2="470" y1="31" y2="451" class="div"/><text x="20" y="58" class="dim">▌ goal</text><text x="20" y="82" class="chat">▸ Goal Contract recorded (4 acceptance criteria)</text><text x="20" y="104" class="chat">▸ implementing… running verification</text><text x="20" y="126" class="ok">✓ Security Reviewer → PASS</text><text x="20" y="148" class="ok">✓ Verifier → PASS</text><text x="20" y="170" class="dim">▸ Diff Reviewer running…</text><text x="20" y="212" class="dim">Build / Plan / custom agents cannot</text><text x="20" y="230" class="dim">invoke the goal-* reviewers, and never</text><text x="20" y="248" class="dim">get a Goal section in their sidebar.</text><text x="490" y="52" class="hdr">GOAL SESSION · running · first-display rainbow</text><line x1="490" x2="980" y1="60" y2="60" class="div"/><text x="490" y="80" class="lbl r0">GOAL</text><text x="490" y="98" class="ln r1">Ship the OAuth refactor</text><text x="490" y="116" class="sm r2">0/5 gates · in progress</text><text x="490" y="134" class="sm r3">□ Pass Prompt Auditor</text><text x="490" y="166" class="hdr">GOAL SESSION · running · settled colours</text><line x1="490" x2="980" y1="174" y2="174" class="div"/><text x="490" y="194" class="lbl label">GOAL</text><text x="490" y="212" class="ln gtitle">Ship the OAuth refactor</text><text x="490" y="230" class="sm meta">3/5 gates · in progress</text><text x="490" y="248" class="sm todo">□ Pass Security Reviewer</text><text x="490" y="280" class="hdr">GOAL SESSION · done</text><line x1="490" x2="980" y1="288" y2="288" class="div"/><text x="490" y="308" class="lbl done">GOAL</text><text x="490" y="326" class="ln done">Fix the parser bug</text><text x="490" y="344" class="sm done">5/5 gates · completed · 2 review cycles</text><text x="490" y="362" class="sm check">✓ All acceptance criteria covered</text><text x="490" y="394" class="hdr">BUILD / OTHER MODE</text><line x1="490" x2="980" y1="402" y2="402" class="div"/><text x="490" y="422" class="todo" font-size="12">▢ OpenCode&apos;s native todo section</text><text x="490" y="440" class="dim">(no Goal section is rendered here)</text></svg>